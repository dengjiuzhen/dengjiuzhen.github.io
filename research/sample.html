<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title><!-- ⚠️ Change page title --> Paper Title</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/paper.css">
</head>

<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <a href="../lobby.html">Lobby</a>
    <a href="../studio.html">Studio</a>
    <a href="../library.html">Library</a>
    <a href="../collection.html">Collection</a>
    <a href="../cafe.html">Café</a>
    <a href="../about.html">About</a>
  </div>
</nav>

<!-- TOP BAR -->
<div class="paper-topbar">

  <div class="paper-back">
    <button class="button" onclick="goBack()">
      ← Library
    </button>
  </div>

  <div class="paper-center">
    <button class="button button-badge" onclick="collectBadge('paper-id')">
      <!-- ⚠️ change paper-id -->
      Collect Badge ✦
    </button>
  </div>

</div>

<!-- COIN -->
<div class="coin-ui">
  ⏱ <span id="time">0.00</span> ⬤
</div>

<main class="paper-container">

  <section class="paper-card">

    <div class="paper-title">
      <!-- ⚠️ Change visible title -->
      Paper Title — Subtitle
    </div>

    <div class="paper-content">

      <div class="paper-text">

        <h3>Abstract</h3>
        <p>
          <!-- ⚠️ Replace abstract -->
          Your abstract goes here.
        </p>

        <h3>Keywords</h3>
        <ul>
          <!-- ⚠️ Replace keywords -->
          <li>keyword 1</li>
          <li>keyword 2</li>
          <li>keyword 3</li>
        </ul>

        <h3>Publication</h3>

        <a href="<!-- ⚠️ DOI or link -->" 
           class="paper-link" 
           target="_blank">

          <!-- ⚠️ Full citation -->
          Author. “Title.” Journal info.

        </a>

      </div>

    </div>

  </section>

</main>

<script src="../js/main.js"></script>

<script>
function goBack() {
  window.location.href = "../library.html";
}
</script>

</body>
</html>
